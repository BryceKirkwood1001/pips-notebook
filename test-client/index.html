<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teach or Perish: test client</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10162a; color: #e8e8f0; font-family: system-ui, sans-serif; }
      #game { width: 100%; height: 100%; }
      .panel { pointer-events: auto; box-sizing: border-box; background: #1a2140; border: 1px solid #39407a;
        border-radius: 8px; padding: 12px; overflow: auto; font-size: 14px; color: #e8e8f0; }
      .panel h2, .panel h3, .panel h4 { margin: 6px 0; }
      .panel textarea, .panel input[type=text], .panel input[type=number], .panel select {
        box-sizing: border-box; width: 100%; background: #0e1330; color: #e8e8f0; border: 1px solid #4a5299;
        border-radius: 4px; padding: 6px; font: inherit; }
      .panel textarea { resize: vertical; }
      .panel select { width: auto; }
      .panel button { background: #3b4bd1; color: #fff; border: 0; border-radius: 4px; padding: 7px 14px;
        margin: 3px 4px 3px 0; font: inherit; cursor: pointer; }
      .panel button.alt { background: #4b5070; }
      .panel button.sel { background: #19a974; }
      .panel button:disabled { opacity: .4; cursor: not-allowed; }
      body.busy .panel button, body.busy .panel input, body.busy .panel textarea { pointer-events: none; opacity: .6; }
      .cols { display: flex; gap: 12px; align-items: flex-start; }
      .cols > div { flex: 1; min-width: 0; }
      .box { background: #121833; border: 1px solid #2c3366; border-radius: 6px; padding: 8px; margin: 6px 0; }
      .ok { color: #5fe3a1; } .bad { color: #ff7b7b; } .dim { color: #9aa0c8; } .warn { color: #ffd166; }
      .log { height: 300px; overflow: auto; font-size: 13px; }
      .log div { padding: 2px 0; border-bottom: 1px solid #232a55; }
      .modal { position: absolute; background: rgba(5,8,20,.85); display: flex; align-items: center; justify-content: center; }
      .modal > div { width: 720px; max-height: 640px; overflow: auto; }
      .bar { display: inline-block; height: 10px; background: #19a974; border-radius: 3px; vertical-align: middle; }
      #banner { position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: #b3261e; color: #fff; padding: 8px 12px;
        display: none; font-size: 14px; }
      #banner b { margin-right: 8px; } #banner button { float: right; }
      #debug { position: fixed; top: 40px; right: 10px; bottom: 10px; width: 460px; z-index: 15; background: rgba(8,10,25,.96);
        border: 2px solid #ffd166; border-radius: 8px; padding: 10px; overflow: auto; display: none; font-size: 12px; }
      #debug pre { white-space: pre-wrap; word-break: break-word; margin: 4px 0; }
    </style>
  </head>
  <body>
    <div id="banner"></div>
    <div id="debug"></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

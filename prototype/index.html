{id:'seasons',title:'Why do we have seasons?',theme:'season',authored:true,reviewed:false,tome:'Earth’s seasons come from the tilt of its rotational axis, about 23.5 degrees. As Earth travels around the Sun, its axis keeps pointing in nearly the same direction. A hemisphere tilted toward the Sun gets more direct sunlight and longer days. The two hemispheres experience opposite seasons at the same time.',required_points:[{id:'tilt',text:'Earth’s axis is tilted about 23.5°.',keywords:['tilt','axis','23.5'],pip_phrase_correct:'Earth’s axis stays tilted about 23.5 degrees',naive_question:'If Earth is tilted, why does the tilt matter?'},{id:'sunlight',text:'Tilt changes sunlight angle and day length.',keywords:['direct sunlight','angle','day length','longer days','sunlight'],pip_phrase_correct:'tilt changes sunlight angle and day length',naive_question:'How does a sunlight angle change heating?'},{id:'hemisphere',text:'Hemispheres have opposite seasons together.',keywords:['hemisphere','opposite seasons','australia','north and south'],pip_phrase_correct:'the hemispheres have opposite seasons at once',naive_question:'Can it be summer in one place and winter elsewhere?'}],misconceptions:[{id:'seasons_distance',label:'Seasons come from distance to the Sun',trigger_keywords:['closer to the sun','farther from the sun','distance from the sun','distance'],bubble_phrase:'summer happens when Earth is closer to the Sun',correction_keywords:['tilt','hemisphere','same time','axis'],better_explanation:'Earth’s tilt changes sunlight angle and day length; distance is not what creates the seasons.'},{id:'seasons_wobble',label:'Earth’s tilt changes dramatically by season',trigger_keywords:['tilts more','tilt more','tilts toward','tilts away'],bubble_phrase:'Earth leans much farther in summer',correction_keywords:['axis','same direction','23.5'],better_explanation:'The axis keeps nearly the same orientation as Earth orbits.'},{id:'seasons_sun',label:'The Sun itself gets hotter in summer', {id:'recursion',title:'What is recursion?',theme:'recursion',authored:true,reviewed:false,tome:'Recursion is a way to solve a problem by solving smaller versions of that same problem. A recursive process needs a base case that can be answered without another recursive call. Each step must move closer to that base case. Without a reachable base case, the calls can continue indefinitely.',required_points:[{id:'self',text:'A function or process calls itself on a smaller subproblem.',keywords:['calls itself','smaller problem','smaller version','recursive call'],pip_phrase_correct:'a recursive process calls itself on a smaller problem',naive_question:'How does a function calling itself ever stop?'},{id:'base',text:'A base case stops recursion.',keywords:['base case','stop','stops','terminates'],pip_phrase_correct:'a base case gives recursion a place to stop',naive_question:'What happens if there is no base case?'},{id:'progress',text:'Each call moves toward the base case.',keywords:['smaller','closer','progress','reduce','toward the base'],pip_phrase_correct:'each call moves closer to the base case',naive_question:'Does every self-call count as useful recursion?'}],misconceptions:[{id:'recursion_no_base',label:'Recursive calls stop on their own',trigger_keywords:['stops on its own','eventually stops','no base case'],bubble_phrase:'recursive calls eventually stop by themselves',correction_keywords:['base case','condition','stop'],better_explanation:'A recursive solution needs a base case that returns without another recursive call.'},{id:'recursion_same',label:'Every recursive call repeats the same problem',trigger_keywords:['same problem each time','same input','does not get smaller'],bubble_phrase:'each call repeats exactly the same task',correction_keywords:['smaller','reduce','progress'],better_explanation:'Each call should receive a smaller or simpler subproblem.'},{id:'recursion_infinite',label:'Recursion is always infinite',trigger_keywords:['always infinite','never ends','recursion cannot stop'],bubble_phrase:'recursion can never end',correction_keywords:['base case','terminates','stop'],better_explanation:'Recursion ends when a call reaches its base case.'}],analogy_flaws:[],builder:{type:'chain',prompt:'Order the steps in a recursive countdown.',tiles:['Return at zero','Call countdown with n − 1','Check whether n is zero','Start with n'],correct_order:[3,2,1,0],on_wrong:{1:'recursion_same'}},example_pick:[{text:'A countdown calls itself with a smaller number until zero returns.',correct:true},{text:'A recursive function always ends once it calls itself.',correct:false,plants:'recursion_no_base'},{text:'Recursion repeats exactly the same input.',correct:false,plants:'recursion_same'},{text:'Every recursive function loops forever.',correct:false,plants:'recursion_infinite'}],monster:{A:[{id:'r-a1',stem:'A recursive countdown reaches zero. What happens?',options:['The base case returns without another call','It keeps calling itself with zero forever','The function becomes a loop automatically','It starts over at the original number'],correct:0,distractor_map:{1:'recursion_no_base',2:'recursion_infinite',3:'recursion_same'}},{id:'r-a2',stem:'Why pass n − 1 to the next call?',options:['It moves toward the base case','It keeps the problem unchanged','It removes the base case','It makes recursion infinite'],correct:0,distractor_map:{1:'recursion_same',2:'recursion_no_base',3:'recursion_infinite'}}],B:[{id:'r-b1',stem:'A function calls itself with smaller inputs until a stopping condition. What is essential?',options:['A base case','A larger input each time','No return path','A second unrelated function'],correct:0,distractor_map:{1:'recursion_same',2:'recursion_no_base',3:'recursion_infinite'}},{id:'r-b2',stem:'A recursive search is not getting closer to its stopping condition. What is the risk?',options:['It may keep calling without reaching the base case','It will stop automatically','It will always find the answer','The base case will move closer'],correct:0,distractor_map:{1:'recursion_no_base',2:'recursion_infinite',3:'recursion_same'}}]},transfer:{A:{id:'r-ta',stem:'A folder contains folders inside folders. How could a program count all files?',options:['Count this folder’s files and recursively count each subfolder','Count only the first folder','Assume every folder is identical','Repeat forever until no folders remain'],correct:0,distractor_map:{1:'recursion_same',2:'recursion_infinite',3:'recursion_no_base'}},B:{id:'r-tb',stem:'A nested menu is processed by a function. What makes the approach safe?',options:['Process a menu then recurse on submenus, with an empty-menu base case','Call on the same menu endlessly','Skip the base case','Assume all menus have one level'],correct:0,distractor_map:{1:'recursion_no_base',2:'recursion_infinite',3:'recursion_same'}},},redemption:[{id:'r-r',stem:'What makes recursion terminate?',options:['A base case reached by smaller subproblems','A function calling itself once','The same input repeated','Nothing; recursion always ends'],correct:0,distractor_map:{1:'recursion_no_base',2:'recursion_same',3:'recursion_infinite'}}],diagnostic:{pre:{id:'r-pre',stem:'What is needed for a recursive function to stop?',options:['A base case','A bigger input','More recursive calls','A random delay'],correct:0,distractor_map:{}},post:{id:'r-post',stem:'How should a recursive process reach its stopping point?',options:['Make progress toward the base case','Repeat the exact same input','Remove its base case','Call itself forever'],correct:0,distractor_map:{}}},links:['seasons','supply_demand']},
{id:'supply_demand',title:'How do supply and demand affect price?',theme:'market',authored:true,reviewed:false,tome:'Demand describes how much buyers want at different prices; supply describes how much sellers offer. When demand rises while supply stays similar, buyers compete for the available goods and price tends to rise. When supply rises while demand stays similar, sellers compete to sell more and price tends to fall. These are tendencies in a simplified market, not guarantees about every real-world price.',required_points:[{id:'demand',text:'Higher demand tends to raise price when supply is similar.',keywords:['demand rises','higher demand','price rises','price increase','supply stays'],pip_phrase_correct:'higher demand tends to raise price when supply is similar',naive_question:'Why would buyers wanting more change the price?'},{id:'supply',text:'Higher supply tends to lower price when demand is similar.',keywords:['supply rises','higher supply','price falls','price decrease','demand stays'],pip_phrase_correct:'higher supply tends to lower price when demand is similar',naive_question:'What if sellers offer more of the same good?'},{id:'ceteris',text:'These are tendencies holding the other factor similar.',keywords:['tend','similar','all else','other factor','not guaranteed'],pip_phrase_correct:'these are tendencies when the other factor stays similar',naive_question:'Do prices always move this way in every market?'}],misconceptions:[{id:'market_demand',label:'More demand lowers price',trigger_keywords:['demand rises price falls','more demand lowers','demand makes price cheaper'],bubble_phrase:'more buyers usually push the price down',correction_keywords:['demand','price rises','supply similar'],better_explanation:'With supply similar, stronger demand tends to push price upward.'},{id:'market_supply',label:'More supply raises price',trigger_keywords:['supply rises price rises','more supply raises','supply makes price higher'],bubble_phrase:'more supply usually function makeMaterialConcept(material){const raw=String(material.text||'').slice(0,6000),sentences=(raw.match(/[^.!?\n]+[.!?]?/g)||[]).map(x=>x.trim()).filter(x=>x.split(/\s+/).length>=4);let chunks=sentences;if(chunks.length<3){const words=raw.split(/\s+/).filter(Boolean),size=Math.ceil(words.length/3);chunks=[words.slice(0,size).join(' '),words.slice(size,size*2).join(' '),words.slice(size*2).join(' ')].filter(Boolean)}if(chunks.length<3)chunks=[raw,raw,raw];const points=[0,1,2].map(i=>chunks[Math.min(chunks.length-1,Math.floor(i*chunks.length/3))].slice(0,260));const keywords=points.map((p,i)=>{const ws=p.toLowerCase().match(/[a-z0-9]{4,}/g)||[];return [...new Set(ws)].slice(0,8).length?[...new Set(ws)].slice(0,8):[`lesson${i+1}`]});const title=`Your notes: ${(material.name||'Lesson material').replace(/\.(txt|md)$/i,'').slice(0,44)}`;const ids=['note_overgeneralize','note_reverse','note_condition'];const misconceptions=[{id:ids[0],label:'Overgeneralizes a lesson detail',trigger_keywords:['always true in every case','never changes','only thing that matters'],bubble_phrase:'this detail is always true in every case',correction_keywords:keywords.flat(),better_explanation:'State the idea from the material and explain when it applies.'},{id:ids[1],label:'Reverses a lesson relationship',trigger_keywords:['the opposite happens','works in reverse','causes the opposite'],bubble_phrase:'the material says the opposite happens',correction_keywords:keywords.flat(),better_explanation:'Restate the relationship in the same direction as the source material.'},{id:ids[2],label:'Drops an important condition',trigger_keywords:['regardless of the conditions','no matter what','without any conditions'],bubble_phrase:'the rule works no matter what the conditions are',correction_keywords:keywords.flat(),better_explanation:'Include the conditions and limits described in the lesson.'}];const falseLine=(i,prefix)=>`${prefix} ${points[i]}`;const opts=[points[0],falseLine(1,'This is always true in every case:'),falseLine(2,'No matter what the conditions are:'),falseLine(0,'The opposite happens:')];const q=(id,stem)=>({id,stem,options:opts,correct:0,distractor_map:{1:ids[0],2:ids[2],3:ids[1]}});const builderTiles=[points[2],points[0],points[1]];const noteTome=sentences.slice(0,4).join(' ').slice(0,1250)||raw.slice(0,1250);const req=points.map((p,i)=>({id:`note${i+1}`,text:p,keywords:keywords[i],pip_phrase_correct:p,naive_question:'How does this detail connect to the rest of the lesson?'}));return {id:'uploaded_notes',title,theme:'market',authored:true,reviewed:false,tome:noteTome,required_points:req,misconceptions,analogy_flaws:[],builder:{type:'chain',prompt:'Put these three ideas from your notes in the same order they appear in the lesson.',tiles:builderTiles,correct_order:[1,2,0],on_wrong:{0:ids[0]}},example_pick:[{text:`A careful summary: ${points[0]}`,correct:true},{text:falseLine(1,'This is always true in every case:'),correct:false,plants:ids[0]},{text:falseLine(2,'No matter what the conditions are:'),correct:false,plants:ids[2]},{text:falseLine(0,'The opposite happens:'),correct:false,plants:ids[1]}],monster:{A:[q('notes-a1','Which statement appears in your uploaded lesson?'),q('notes-a2','Which detail best matches your notes?')],B:[q('notes-b1','Pip has another chance. Which statement matches the lesson?'),q('notes-b2','A monster asks for a detail from the notes. Which one fits?')]},transfer:{A:q('notes-ta','A new student summarizes your material. Which claim stays closest to the source?'),B:q('notes-tb','In a different classroom, which statement still matches the uploaded lesson?')},redemption:[q('notes-r','Which statement should Pip keep from the uploaded lesson?')],diagnostic:{pre:q('notes-pre','Before teaching, which detail is in the uploaded material?'),post:q('notes-post','After the lesson, which detail matches the uploaded material?')},links:[]}}

function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const randSeed=()=>Math.floor(Math.random()*0x7fffffff);let rng=Math.random;const $=s=>document.querySelector(s);const uid=()=>`e${state.nextId++}`;
let state={screen:'START',phase:'tome',seed:0,room:0,rooms:[],trait:'skeptic',hearts:5,customMaterials:null,customConcepts:[],notebook:[],curses:[],mastery:{},log:[],nextId:1,actions:[],builderDone:false,builderScore:0,exampleScore:0,covered:{},revealed:false,door:null,doorNext:null,extraThreshold:0,well:false,questions:[],qIndex:0,failedQuestions:[],retryUsed:{},answers:{},preAnswers:[],postAnswers:[],testIndex:0,bossRetry:false,bossLosses:0,redemptionRooms:[],redemptionActionCount:0,correctionAttempts:3,selectedPhrase:null,trace:[],insight:0,runHistory:[],settings:{offline:true,key:'',model:'claude-3-5-haiku-latest'},aiLog:[],debug:new URLSearchParams(location.search).has('debug'),lastResult:null};

function current(){const item=state.rooms[state.room];return typeof item==='string'?concept(item):(item||null)}function concept(id){return CONTENT.find(c=>c.id===id)||state.customConcepts?.find(c=>c.id===id)||null}function activeCurse(id){return state.curses.filter(c=>c.concept===id)}function normalize(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9. ]/g,' ')}

function detect(c,text){const covers=c.required_points.filter(p=>matches(text,p.keywords)).map(p=>p.id);const triggers=c.misconceptions.filter(m=>matches(text,m.trigger_keywords)).map(m=>m.id);if(state.trait==='over'&&/\b(always|never|all|every|none|only)\b/i.test(text))triggers.push(`overgeneralized_${c.id}`);return {covers_points:[...new Set(covers)],triggers:[...new Set(triggers)],quality:covers.length}}

function tokenize(s){return new Set(normalize(s).split(/\s+/).filter(w=>w.length>2&&!['the','and','for','with','that','this','from','what','when','into'].includes(w)))}
function retrieve(c,q){const qset=tokenize(q);const eligible=state.notebook.filter(e=>e.concept===c.id||c.links.includes(e.concept));return eligible.map((e,index)=>{const es=tokenize(e.text);let overlap=[...qset].filter(x=>es.has(x)).length/(new Set([...qset,...es]).size||1);return {entry:e,score:overlap+((index+1)/eligible.length)*.05}}).sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.entry)}
function decide(c,q,masteryOverride=null){const cursed=[];for(let i=0;i<q.options.length;i++){const id=q.distractor_map?.[i];const cur=activeCurse(c.id).find(x=>x.misconception_id===id)||state.curses.find(x=>x.misconception_id===id);if(cur)cursed.push({i,cur})}let chosen,reason,cur=null;const threshold=60+(state.well?-10:0)+state.extraThreshold;if(cursed.length){cursed.sort((a,b)=>b.cur.severity-a.cur.severity||a.i-b.i);chosen=cursed[0].i;reason='curse';cur=cursed[0].cur}else if((masteryOverride??state.mastery[c.id]??0)>=threshold){chosen=q.correct;reason='knows'}else{let possible=q.options.map((_,i)=>i).filter(i=>!q.distractor_map?.[i]);if(!possible.includes(q.correct))possible.push(q.correct);chosen=possible[Math.floor(rng()*possible.length)];reason=chosen===q.correct?'guess':'guess'}return {chosen,reason,curse:cur,trace:retrieve(c,q.stem)}}

ata-id="${i}"><span class="example-mark">${String.fromCharCode(65+i)}</span>${escapeText(x.text)}<span class="example-go">›</span></button>`).join('')}</div></section>`}wrap.innerHTML=`<div class="eyebrow">Room ${state.room+1} · Teach Pip</div><div class="teach-heading"><div><h1 class="title" style="font-size:clamp(28px,4vw,40px)">Help Pip learn.</h1><p class="muted">Complete all 3 lessons to open the monster’s gate.</p></div><span class="progress-pill">${completed} of 3 done</span></div><nav class="teach-tabs" aria-label="Teaching tools">${actions.map(([id,label],i)=>`<button class="teach-tab ${activeTeach===id?'active':''} ${state.actions.includes(id)?'done':''}" data-act="teachTab" data-id="${id}"><span>${state.actions.includes(id)?'✓':i+1}</span>${label}</button>`).join('')}</nav>${panel}<div class="teach-footer"><button class="quiet" data-act="drawer" data-id="${c.id==='uploaded_notes'?'materials':'tome'}">${c.id==='uploaded_notes'?'Open uploaded notes':'Open lesson notes'}</button><button class="primary" data-act="toMind" ${completed<3?'disabled':''}>${completed<3?'Finish all 3 lessons':'Check Pip’s understanding →'}</button></div>`}

else if(screen==='REDEMPTION_RETEACH'){const ids=state.redemptionRooms;wrap.innerHTML=`<div class="eyebrow">Redemption dungeon · weakest lessons</div><h1 class="title">One more chance to teach.</h1><p class="muted">Pick one action for each lesson. Active curse names are shown; the original notebook stays intact.</p>${ids.map(id=>{const c=concept(id),orig=state.notebook.filter(e=>e.concept===id&&e.action==='explain').map(e=>`<p class="small">“${escapeText(e.text)}”</p>`).join('')||'<p class="small muted">No original explanation.</p>';const count=state.redemptionCounts?.[id]||0;return `<section class="card"><h3>${escapeText(c.title)}</h3>${orig}<p class="small">Curses: ${activeCurse(id).map(x=>escapeText(x.label)).join(', ')||'none'} · reteach actions ${count}/2</p>${count<2?`<div class="field"><textarea id="redeem-${id}" placeholder="Teach the core idea again (at least 40 characters)…"></textarea></div><button class="primary" data-act="redeem" data-id="${id}">Save reteaching action ${count+1}/2</button>`:''}</section>`}).join('')}<button class="primary" data-act="redemptionGauntlet" ${state.redemptionRooms.some(id=>(state.redemptionCounts?.[id]||0)<2)?'disabled':''}>Enter redemption gauntlet →</button>`}
else if(screen==='REDEMPTION_GAUNTLET'){const q=state.redemptionQuestions[state.redemptionIndex];renderQuestion(q,`Redemption · ${state.redemptionIndex+1}/2`,i=>{const id=state.redemptionRooms[state.redemptionIndex],c=concept(id),d=decide(c,q);const right=d.chosen===q.correct;if(!right)changeHearts(-1,'redemption');log('redemption_answer',{question_id:q.id,correct:right});state.redemptionIndex++;if(!right)state.redemptionCorrect=false;if(state.hearts===0){state.lastResult='LOSS';go('AUTOPSY')}else if(state.redemptionIndex>=2){redemptionDone()}else render()},true);return}
else if(screen==='AUTOPSY'){const events=state.log.filter(x=>x.type==='curse_planted');wrap.innerHTML=`<div class="eyebrow" style="color:var(--coral)">Misconception autopsy</div><h1 class="title">Trace the belief to its source.</h1><p class="subtitle">${events.length?'Every curse is shown with the exact notebook words or action that planted it.':'No curse was recorded on this run.'}</p><div class="stack">${events.map(ev=>{const e=state.notebook.find(x=>x.id===ev.source_entry_id);const m=concept(ev.concept)?.misconceptions.find(x=>x.id===ev.misconception_id);return `<section class="card"><span class="tag bad">Room ${(ev.planted_room||0)+1}</span><p>You used ${ev.cause==='trap'?'this example':ev.cause==='builder'?'this builder result':'these words'}:</p><blockquote>${escapeText(e?.text||'No quoted words; curse came from a selected action.')}</blockquote><p>→ Pip believed “${escapeText(m?.bubble_phrase||'this works the same way in every case')}”</p><p><b>A stronger way to say it:</b> ${escapeText(m?.better_explanation||'Use a careful example and name where the rule applies.')}</p></section>`}).join('')}</div><button class="primary" data-act="posttest">Take the final check →</button>`}
else if(screen==='REPORT'){wrap.innerHTML=reportMarkup()}
else if(screen==='SETTINGS'||screen==='UNLOCKS'||screen==='HISTORY'){const content=screen==='SETTINGS'?`<h2>Settings</h2><label><input type="checkbox" id="offline" ${state.settings.offline?'checked':''} style="width:auto"> Offline mode</label><p class="small muted">AI dialogue is optional. The deterministic fallback is always used for game outcomes.</p><div class="field"><label>API key (saved only on this device)</label><input id="apiKey" type="password" value="${escapeText(state.settings.key)}" placeholder="Optional"></div><div class="field"><label>Model name</label><input id="model" value="${escapeText(state.settings.model)}"></div><button class="primary" data-act="saveSettings">Save settings</button>`:screen==='UNLOCKS'?`<h2>Unlocks</h2><p class="muted">Insight: ${state.insight}</p><p>The first milestone keeps the card pool focused on the core three teaching actions. Additional action cards unlock in a later milestone.</p><button data-act="home">Back</button>`:`<h2>Run history</h2><div>${state.runHistory.map(x=>`<p>${x.result} · seed ${x.seed} · ${x.insight} insight</p>`).join('')||'No finished runs yet.'}</div><button data-act="home">Back</button>`;wrap.innerHTML=`<div class="eyebrow">${screen}</div><div class="card">${content}</div>`}
if(screen==='ROOM'&&wrap.childElementCount)wrap.insertAdjacentHTML('afterbegin',phaseRail())
}
function reasonLine(d,q){if(d.reason==='knows'){const e=d.trace[0];return e?`I remember from “${e.action}”: ${e.text.slice(0,90)}${e.text.length>90?'…':''}`:'I know this from my notebook.'}if(d.reason==='curse')return `I’m thinking: “${d.curse.bubble_phrase}.”`;return 'I’m not sure what you taught me about this, so I’m guessing.'}
function renderQuestion(q,label,onAnswer,showPip){const wrap=$('#main .screen');wrap.innerHTML=`${showPip?phaseRail():''}<div class="eyebrow">${label} ${showPip?badge():''}</div><h1 class="title" style="font-size:clamp(25px,4vw,38px)">${escapeText(q.stem)}</h1>${showPip?`<div class="pip-thinking"><span class="thinking-face">🤖</span><div><b>Pip is thinking…</b><p>Checking the notebook for a lesson to use.</p></div><span class="thinking-dots" aria-hidden="true"><i></i><i></i><i></i></span></div>`:`<p class="muted">Pick the best answer. This check gives no feedback.</p><div class="stack">${q.options.map((o,i)=>`<button class="choice" data-qoption="${i}">${escapeText(o)}</button>`).join('')}</div>`}<div class="row"><span class="tag">${showPip?'Pip chooses; you observe':'Your learning check'}</span></div>`;if(showPip){setTimeout(()=>onAnswer(),850)}else{wrap.querySelectorAll('[data-qoption]').forEach(b=>b.addEventListener('click',()=>onAnswer(Number(b.dataset.qoption))))}}
function doorCopy(d){return {LIBRARY:'Reveal the next room’s three required points.',SHRINE:'Remove one active curse now.',FORGE:'One builder attempt gets a retry next room.',GAMBIT:'Gain one heart; the next room has three questions.',MIRROR:'See the names of all active curses.',WELL:'Lower next room’s threshold by 10.'}[d]}
function gradeFromHearts(hearts){return [{score:100,letter:'A',label:'Outstanding'},{score:85,letter:'B',label:'Strong'},{score:70,letter:'C',label:'Passing'},{score:55,letter:'D',label:'Needs practice'},{score:40,letter:'F',label:'At risk'},{score:0,letter:'F',label:'Needs a retry'}][5-Math.max(0,Math.min(5,hearts))]}
function reportMarkup(){const grade=gradeFromHearts(state.hearts);const gain=state.postAnswers.filter((x,i)=>x?.correct&&!state.preAnswers[i]?.correct).length;const result=state.lastResult||'RUN ENDED';const summary=`Teach or Perish — ${result}\nSeed: ${state.seed}\nTrait: ${TRAITS[state.trait].name}\nHearts: ${state.hearts}\nInsight: ${state.insight}\nMastery: ${state.rooms.map(id=>`${concept(id).title}: ${state.mastery[id]||0}%`).join('; ')}`;return `<div class="eyebrow">Run report</div><h1 class="title">${result==='WIN'?'Pip made it through.':'The lesson is yours to keep.'}</h1><p class="subtitle">Seed ${state.seed} · ${TRAITS[state.trait].name} · ${state.insight} insight</p><div class="grade-card"><div class="grade-letter">${grade.letter}</div><div><div class="eyebrow">Pip’s final grade · ${grade.score}/100</div><h2>${grade.label}</h2><p class="muted">Pip finished with ${state.hearts} of 5 health. Every heart carried through the rooms and boss counts toward this grade.</p></div></div><div class="report-grid">${state.rooms.map(id=>`<div class="card"><b>${escapeText(concept(id).title)}</b><div class="meter"><span style="--fill:${(state.mastery[id]||0)/100}"></span></div>${state.mastery[id]||0}% mastery<br><span class="small muted">${activeCurse(id).length} active curses</span></div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>Learning check</h3><p>Pre-test: ${state.preAnswers.filter(x=>x?.correct).length}/${state.preAnswers.length||0} · Post-test: ${state.postAnswers.filter(x=>x?.correct).length}/${state.postAnswers.length||0} · Gain: +${gain} · Curses caught: ${state.log.filter(x=>x.type==='curse_removed'&&x.how==='mindreader').length} · Missed: ${state.curses.length}</p><svg viewBox="0 0 320 100" role="img" aria-label="Pre and post scores" style="width:100%;max-width:420px"><line x1="20" y1="80" x2="300" y2="80" stroke="#55646a"/><polyline points="${state.rooms.map((_,i)=>`${35+i*90},${80-(state.preAnswers[i]?.correct?55:12)}`).join(' ')}" fill="none" stroke="#88cfff" stroke-width="3"/><polyline points="${state.rooms.map((_,i)=>`${35+i*90},${80-(state.postAnswers[i]?.correct?55:12)}`).join(' ')}" fill="none" stroke="#c4f26a" stroke-width="3"/></svg><p class="small muted">Blue: pre-test · Green: post-test</p></div><div class="row"><button class="primary" data-act="copy">Copy summary</button><button data-act="home">Return home</button><button data-act="playAgain">New run</button></div>`}
function toast(text){const n=document.createElement('div');n.className='toast';n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),2200)}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({state:{...state,debug:false},settings:state.settings,history:state.runHistory}));const top=JSON.parse(localStorage.getItem(TOP_KEY)||'{}');top.unlocked=top.unlocked||[];top.history=state.runHistory.slice(-10);localStorage.setItem(TOP_KEY,JSON.stringify(top))}catch{}}
function load(){try{const raw=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');if(raw.state){const debugFlag=state.debug;Object.assign(state,raw.state);state.debug=debugFlag;if(state.settings)Object.assign(state.settings,raw.settings||{});state.runHistory=raw.history||[];rng=mulberry32(state.seed||1)}}catch{}}
function debugRender(){if(!state.debug)return;const d=$('#debug');d.innerHTML=`<b>DEBUG · ${state.screen}/${state.phase}</b><div class="debug-controls"><button data-act="tests">Run self-tests</button><button data-act="debugHeart">Set hearts 5</button><button data-act="debugAutoplay">Run balance simulation</button></div><pre id="debugJson"></pre><div><b>LLM / fallback log</b><pre id="debugCalls"></pre><b>Curse sources</b><pre id="debugCurses"></pre><b>Perf · <span id="fps">FPS —</span></b><pre id="perf"></pre></div>`;$('#debugJson').textContent=JSON.stringify({screen:state.screen,phase:state.phase,seed:state.seed,trait:state.trait,room:state.room,hearts:state.hearts,mastery:state.mastery},null,2);$('#debugCalls').textContent=JSON.stringify(state.aiLog,null,2);$('#debugCurses').textContent=JSON.stringify(state.curses,null,2)}
function autoplayDemo(){const snapshot=JSON.stringify(state),oldRng=rng,oldFx=fx;let carefulClear=0,careful4=0,carelessLoss=0;try{fx=()=>{};for(let trial=0;trial<20;trial++){rng=mulberry32(8100+trial);state.rooms=CONTENT.map(c=>c.id);state.curses=[];state.mastery={};state.notebook=[];state.trait=Object.keys(TRAITS)[trial%4];let hearts=5,failed=false;for(const c of CONTENT){state.mastery[c.id]=100;for(const q of c.monster.A){const d=decide(c,q);if(d.chosen!==q.correct)hearts--}if(hearts<=0){failed=true;break}}if(!failed)carefulClear++;if(!failed&&hearts>=4)careful4++;
state.curses=[];state.mastery={};hearts=5;failed=false;for(const c of CONTENT){state.mastery[c.id]=0;c.misconceptions.forEach(m=>state.curses.push({misconception_id:m.id,concept:c.id,severity:1,bubble_phrase:m.bubble_phrase,planted_room:0}));for(const q of c.monster.A){const d=decide(c,q);if(d.chosen!==q.correct)hearts--}if(hearts<=0){failed=true;break}}if(!failed){hearts=Math.max(3,hearts);const boss=CONTENT.map(c=>({c,q:c.transfer.A}));boss.push({c:CONTENT[1],q:COMBOS[0].q,concepts:COMBOS[0].concepts});for(const item of boss){const floor=item.concepts?Math.min(...item.concepts.map(id=>state.mastery[id])):state.mastery[item.c.id];const d=decide(item.c,item.q,floor);if(d.chosen!==item.q.correct)hearts-=2;if(hearts<=0){failed=true;break}}}if(failed)carelessLoss++}
return {trials:20,careful:{roomsCleared:carefulClear,withAtLeast4Hearts:careful4,clearRate:carefulClear/20,"4HeartRate":careful4/20},careless:{roomOrBossLosses:carelessLoss,lossRate:carelessLoss/20},note:'Deterministic engine simulation of monster decisions; teaching UI and recovery choices are not included.'}}finally{rng=oldRng;fx=oldFx;state=Object.assign(state,JSON.parse(snapshot))}}
function perf(){let last=performance.now(),frames=0,windowStart=last,min=60,longest=0;function tick(now){const dt=now-last;last=now;frames++;longest=Math.max(longest,dt);if(now-windowStart>=1000){const fps=Math.round(frames*1000/(now-windowStart));min=Math.min(min,fps);const el=$('#fps');if(el)el.textContent=`FPS ${fps} · min ${min}`;const p=$('#perf');if(p)p.textContent=`Longest frame (last 5s rolling approx): ${longest.toFixed(1)} ms\nAnimated elements peak: ${document.querySelectorAll('.screen,.fx-shake,.fx-pop,.fx-dissolve').length}`;frames=0;windowStart=now;longest=0}requestAnimationFrame(tick)}requestAnimationFrame(tick)}
/* ================= TESTS ================= */
window.runSelfTests=selfTest;
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,id=b.dataset.id;
switch(act){case'usePasted':{const text=$('#pastedNotes')?.value.trim();if(!text){toast('Paste some lesson notes first.');break}state.customMaterials={name:'Pasted lesson notes',text:text.slice(0,6000)};save();render();toast('Lesson material added to this expedition.');break}case'clearMaterials':state.customMaterials=null;save();render();break;case'play':{const raw=$('#seed')?.value.trim();makeRun(raw?Number(raw)>>>0:randSeed());break}case'ready':startTeaching();break;case'explain':submitExplain($('#explainText').value);break;case'builder':checkBuilder();break;case'tileMove':{const i=Number(id),a=state.tileOrder;if(i<a.length-1)[a[i],a[i+1]]=[a[i+1],a[i]];else [a[i],a[0]]=[a[0],a[i]];render();break}case'shuffle':{const a=state.tileOrder;for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}render();break}case'example':submitExample(Number(id));break;case'toMind':advanceTeaching();break;case'reteach':reteachRoom();break;case'continueDoor':chooseDoors();break;case'teachTab':state.activeTeach=id;render();break;case'phrase':if(id)selectPhrase(id);else toast('That phrase is not tied to a known curse.');break;case'correct':correctCurse(state.selectedPhrase,$('#correction').value);break;case'monster':case'skipMind':beginMonster();break;case'nextRoomQ':nextRoomQ();break;case'door':chooseDoor(id);break;case'retryRoom':if(state.retryUsed[current().id]){state.lastResult='LOSS';go('AUTOPSY')}else{state.retryUsed[current().id]=true;if(state.hearts===0)state.hearts=1;startRoom()}break;case'autopsy':state.lastResult='LOSS';go('AUTOPSY');break;case'openBoss':openBoss();break;case'nextBoss':nextBoss();break;case'redeem':{const c=concept(id),text=$(`#redeem-${id}`).value;if(text.length<40){toast('Write at least 40 characters.');break}const ent=addEntry('explain',text,id);const det=detect(c,text);det.triggers.forEach(mid=>plant(mid,id,ent.id,'explain'));state.redemptionCounts[id]=(state.redemptionCounts[id]||0)+1;state.redemptionActionCount++;recompute(id);render();break}case'redemptionGauntlet':state.hearts=3;state.redemptionCorrect=true;state.redemptionQuestions=state.redemptionRooms.map(id=>concept(id).redemption[0]);state.redemptionIndex=0;go('REDEMPTION_GAUNTLET');break;case'posttest':state.testIndex=0;state.screen='POSTTEST';state.testIndex=0;diagnostic('post');break;case'copy':navigator.clipboard?.writeText(reportMarkup().replace(/<[^>]*>/g,' ')).then(()=>toast('Summary copied.')).catch(()=>toast('Copy unavailable in this browser.'));break;case'home':go('START');break;case'playAgain':go('START');break;case'settings':go('SETTINGS');break;case'unlocks':go('UNLOCKS');break;case'history':go('HISTORY');break;case'saveSettings':state.settings.offline=$('#offline').checked;state.settings.key=$('#apiKey').value;state.settings.model=$('#model').value;go('START');break;case'drawer':openDrawer(id);break;case'tests':try{const r=selfTest();toast(`Self-tests passed (${r.cases}).`)}catch(err){toast(err.message)}break;case'debugHeart':state.hearts=5;render();break;case'debugAutoplay':{const result=autoplayDemo();const out=$('#debugCalls');if(out)out.textContent=JSON.stringify(result,null,2);toast(`Balance sim: careful ${Math.round(result.careful['4HeartRate']*100)}%, careless losses ${Math.round(result.careless.lossRate*100)}%`);break};}}
);
document.addEventListener('change',async e=>{if(e.target.id==='materialsFile'){const f=e.target.files?.[0];if(!f)return;if(!/\.(txt|md)$/i.test(f.name)){toast('Choose a .txt or .md file.');e.target.value='';return}try{const wholeText=await f.text();const text=wholeText.slice(0,6000);if(!text.trim()){toast('That file is empty.');return}state.customMaterials={name:f.name,text};save();render();toast(wholeText.length>6000?'Added the first 6,000 characters of your material.':'Lesson material added to this expedition.')}catch{toast('Could not read that file.')}}});
document.addEventListener('input',e=>{if(e.target.id==='explainText'){const n=$('#counter');n.textContent=`${e.target.value.length} / 280`}});
function openDrawer(which){const existing=$('#drawer');if(existing){existing.remove();$('#backdrop')?.remove();return}const d=document.createElement('section');d.id='drawer';d.className='drawer open';d.dataset.ui='drawer';const title=which==='tome'?'Room Tome':which==='materials'?'Uploaded lesson material':'Pip’s notebook';const body=document.createElement('div');if(which==='tome'){body.textContent=current()?.tome||'Start a room to open the Tome.'}else if(which==='materials'){body.textContent=state.customMaterials?.text||'No uploaded material.'}else{state.notebook.forEach(e=>{const p=document.createElement('p');p.textContent=`${e.action}: ${e.text}`;body.append(p)})}const close=document.createElement('button');close.textContent='Close';close.dataset.act='drawer';d.append(close);const h=document.createElement('h2');h.textContent=title;d.append(h,body);const back=document.createElement('div');back.id='backdrop';back.className='backdrop';back.addEventListener('click',()=>{d.remove();back.remove()});document.body.append(back,d)}
function finishRun(){state.runHistory.unshift({seed:state.seed,result:state.lastResult,insight:state.insight});state.runHistory=state.runHistory.slice(0,10);save()}
const oldGo=go;go=function(screen){oldGo(screen);if(['REPORT'].includes(screen))finishRun();debugRender();save()};
load();render();debugRender();if(state.debug){try{selfTest()}catch(e){console.error('Self test failed',e)}}perf();requestAnimationFrame(worldLoop);
